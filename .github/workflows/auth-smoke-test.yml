name: Production Auth Smoke Test

# Recurring check that a real login against the real production Supabase
# project actually works end-to-end, and that a resulting token is accepted
# by a real protected endpoint. Exists because CI's docker-build job only
# ever talks to placeholder Supabase credentials and an unauthenticated
# health endpoint — it structurally cannot catch a real-auth regression
# (JWKS changes, key rotation, signing-method changes). See
# Backend/RUNBOOK.md "Auth smoke test" for the full writeup and the outage
# this is meant to prevent recurring.
#
# Deliberately NOT a pull_request/push trigger: this needs live production
# credentials and shouldn't gate normal development on live external state.

on:
  schedule:
    # Asks for every 10 min, but GitHub runs schedules late (often hours
    # apart), so this does NOT keep Render's free instance awake.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/scripts/smoke-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Backend/scripts/smoke-test/package-lock.json

      - name: Install
        run: npm ci

      - name: Run auth smoke test against live production
        run: node authSmokeTest.mjs
        env:
          SMOKE_BACKEND_URL: https://musify-api-m2dw.onrender.com
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # Alerting without Sentry: a new issue notifies the repo owner (email /
      # GitHub app). One open issue per outage, closed when the test recovers.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq length)
          [ "$open" -gt 0 ] || gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
            --body "Production login is failing. Run: $RUN_URL — see Backend/RUNBOOK.md \"Auth smoke test\"."

      - name: Close the failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[].number' |
            xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"

    env:
      ISSUE_TITLE: Production auth smoke test failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
